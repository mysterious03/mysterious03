<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <!-- Matrix Phosphor Green Glow Filter -->
    <filter id="matrixTextGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Matrix Text Shimmer Gradient (Sweeps across characters) -->
    <linearGradient id="textShimmer" x1="-100%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41" />
      <stop offset="35%" stop-color="#00ff41" />
      <stop offset="48%" stop-color="#a3ffbc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#a3ffbc" />
      <stop offset="65%" stop-color="#00ff41" />
      <stop offset="100%" stop-color="#00ff41" />
      <animate attributeName="x1" from="-100%" to="100%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes glitchText {
        0%, 92%, 100% {
          transform: translate(0, 0);
          opacity: 1;
        }
        93% {
          transform: translate(-2px, 1px);
          opacity: 0.85;
          text-shadow: 2px 0 #55ff88, -2px 0 #008f11;
        }
        94% {
          transform: translate(2px, -1px);
          opacity: 0.9;
        }
        95% {
          transform: translate(-1px, -1px);
          opacity: 1;
        }
        96% {
          transform: translate(0, 0);
        }
      }

      @keyframes pulseGlow {
        0%, 100% {
          filter: drop-shadow(0 0 6px rgba(0, 255, 65, 0.7)) drop-shadow(0 0 16px rgba(0, 255, 65, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 12px rgba(0, 255, 65, 0.95)) drop-shadow(0 0 28px rgba(0, 255, 65, 0.6));
        }
      }

      .main-title {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 48px;
        font-weight: 800;
        letter-spacing: 5px;
        animation: glitchText 4s infinite, pulseGlow 3s infinite ease-in-out;
      }

      .subtitle-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 2px;
      }

      .cursor {
        animation: blink 0.9s infinite;
      }

      .prompt-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 3px;
        opacity: 0.6;
      }
    </style>
  </defs>

  <!-- Clean Minimalist Background (Transparent with subtle dark container for universal contrast) -->
  <rect width="900" height="160" rx="12" fill="#030804" fill-opacity="0.9" stroke="#00ff41" stroke-opacity="0.25" stroke-width="1" />

  <g transform="translate(450, 42)" text-anchor="middle">
    <!-- Prompt prefix -->
    <text y="0" fill="#7efa9a" class="prompt-tag">
      &gt; echo $IDENTITY
    </text>

    <!-- Main Name with Matrix Glitch + Shimmer + Phosphor Glow -->
    <text y="48" fill="url(#textShimmer)" class="main-title" filter="url(#matrixTextGlow)">
      SURIYA PRAKASH<tspan class="cursor" fill="#00ff41">_</tspan>
    </text>

    <!-- Curious human obsessed tagline -->
    <text y="88" fill="#55ff88" class="subtitle-text" filter="url(#subtleGlow)">
      curious human being obsessed with building &amp; exploring
    </text>
  </g>
</svg>
