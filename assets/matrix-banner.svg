<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Matrix Green Gradients -->
    <linearGradient id="rainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0" />
      <stop offset="60%" stop-color="#008f11" stop-opacity="0.6" />
      <stop offset="90%" stop-color="#00ff41" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="rainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003b00" stop-opacity="0" />
      <stop offset="70%" stop-color="#00ff41" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#55ff88" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020803" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#010402" stop-opacity="0.96" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes fallFast {
        0% { transform: translateY(-260px); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translateY(260px); opacity: 0; }
      }
      @keyframes fallMedium {
        0% { transform: translateY(-240px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(250px); opacity: 0; }
      }
      @keyframes fallSlow {
        0% { transform: translateY(-220px); opacity: 0; }
        25% { opacity: 0.7; }
        75% { opacity: 0.7; }
        100% { transform: translateY(240px); opacity: 0; }
      }
      @keyframes borderPulse {
        0%, 100% { stroke: #00ff41; stroke-opacity: 0.5; filter: drop-shadow(0 0 4px #00ff41); }
        50% { stroke: #55ff88; stroke-opacity: 1; filter: drop-shadow(0 0 12px #00ff41); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(240px); }
      }

      .f-1 { animation: fallFast 3.2s linear infinite; }
      .f-2 { animation: fallMedium 4.5s linear infinite 0.8s; }
      .f-3 { animation: fallSlow 5.5s linear infinite 1.6s; }
      .f-4 { animation: fallFast 3.8s linear infinite 2.2s; }
      .f-5 { animation: fallMedium 4.8s linear infinite 1.1s; }
      .f-6 { animation: fallSlow 6.0s linear infinite 0.4s; }
      .f-7 { animation: fallFast 3.5s linear infinite 2.8s; }
      .f-8 { animation: fallMedium 4.2s linear infinite 1.9s; }

      .card-border {
        animation: borderPulse 4s infinite ease-in-out;
      }
      .beacon {
        animation: beaconBlink 1.4s infinite ease-in-out;
      }
      .scanner-bar {
        animation: scanline 4s linear infinite;
        opacity: 0.08;
      }
    </style>
  </defs>

  <!-- Deep Black Matrix Void -->
  <rect width="900" height="240" fill="#000000" rx="14" />

  <!-- Animated Matrix Falling Rain Streams (Background Layer) -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="700" letter-spacing="4">
    <!-- Col 1 -->
    <g class="f-1" transform="translate(30, 0)">
      <text x="0" y="0" fill="url(#rainGrad1)">1 0 A F 9 2 C X 0 1 B 7 4 8</text>
    </g>
    <!-- Col 2 -->
    <g class="f-3" transform="translate(70, 0)">
      <text x="0" y="0" fill="url(#rainGrad2)">0 1 1 0 E 3 D 8 2 1 9 A F</text>
    </g>
    <!-- Col 3 -->
    <g class="f-2" transform="translate(110, 0)">
      <text x="0" y="0" fill="url(#rainGrad1)">A 9 F 0 1 8 4 B 3 C 7 2 0</text>
    </g>
    <!-- Col 4 -->
    <g class="f-5" transform="translate(150, 0)">
      <text x="0" y="0" fill="url(#rainGrad2)">8 3 C 2 9 0 1 E F 4 5 A 8</text>
    </g>
    <!-- Col 5 -->
    <g class="f-4" transform="translate(190, 0)">
      <text x="0" y="0" fill="url(#rainGrad1)">0 1 0 1 1 0 0 1 0 1 A F 9</text>
    </g>
    <!-- Col 6 -->
    <g class="f-7" transform="translate(230, 0)">
      <text x="0" y="0" fill="url(#rainGrad2)">F 7 2 B 8 0 1 9 4 C D 3 E</text>
    </g>
    <!-- Col 7 -->
    <g class="f-2" transform="translate(670, 0)">
      <text x="0" y="0" fill="url(#rainGrad1)">1 0 8 4 C F 9 2 0 1 B 3 E</text>
    </g>
    <!-- Col 8 -->
    <g class="f-6" transform="translate(710, 0)">
      <text x="0" y="0" fill="url(#rainGrad2)">A F 0 1 9 3 8 2 D 7 4 C B</text>
    </g>
    <!-- Col 9 -->
    <g class="f-3" transform="translate(750, 0)">
      <text x="0" y="0" fill="url(#rainGrad1)">0 1 1 0 8 2 E 9 A F 4 3 C</text>
    </g>
    <!-- Col 10 -->
    <g class="f-8" transform="translate(790, 0)">
      <text x="0" y="0" fill="url(#rainGrad2)">C 3 F 9 0 1 8 2 B 4 A 7 D</text>
    </g>
    <!-- Col 11 -->
    <g class="f-1" transform="translate(830, 0)">
      <text x="0" y="0" fill="url(#rainGrad1)">0 1 A F 3 C 8 2 9 0 1 E 4</text>
    </g>
    <!-- Col 12 -->
    <g class="f-5" transform="translate(870, 0)">
      <text x="0" y="0" fill="url(#rainGrad2)">1 0 0 1 F 9 A 8 3 C 2 D 7</text>
    </g>
  </g>

  <!-- Moving Ambient Scanline -->
  <rect x="0" y="0" width="900" height="12" fill="#00ff41" class="scanner-bar" />

  <!-- Center Matrix Terminal HUD Card -->
  <g transform="translate(140, 25)">
    <!-- Card Background -->
    <rect width="620" height="190" rx="12" fill="url(#cardGrad)" class="card-border" stroke="#00ff41" stroke-width="1.8" />

    <!-- Terminal Header Bar -->
    <path d="M 0 12 C 0 5.4 5.4 0 12 0 L 608 0 C 614.6 0 620 5.4 620 12 L 620 32 L 0 32 Z" fill="#040f06" />
    <line x1="0" y1="32" x2="620" y2="32" stroke="#00ff41" stroke-opacity="0.3" stroke-width="1" />

    <!-- Terminal Window Controls -->
    <circle cx="20" cy="16" r="4.5" fill="#ff5f56" />
    <circle cx="36" cy="16" r="4.5" fill="#ffbd2e" />
    <circle cx="52" cy="16" r="4.5" fill="#27c93f" />

    <!-- Terminal Title -->
    <text x="50%" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#7ee787" letter-spacing="1">
      root@matrix-node:~ // SURIYA_PRAKASH
    </text>

    <!-- Beacon Dot -->
    <circle cx="585" cy="16" r="4" fill="#00ff41" class="beacon" filter="url(#textGlow)" />
    <text x="570" y="20" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00ff41">LIVE</text>

    <!-- Main Title Inside Terminal -->
    <g transform="translate(35, 68)">
      <!-- Hacker Prefix -->
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00ff41" letter-spacing="1.5">
        &gt; SYSTEM_ID: DEVELOPER_CORE
      </text>

      <!-- Main Name with Neon Glow -->
      <text x="0" y="38" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" filter="url(#textGlow)" letter-spacing="0.5">
        SURIYA PRAKASH
      </text>

      <!-- Subtitle Description -->
      <text x="0" y="65" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#a3e635">
        AI/ML Models &bull; IoT Hardware Builder &bull; Frontend Web UIs
      </text>

      <!-- Terminal Badges Row -->
      <g transform="translate(0, 85)">
        <rect width="115" height="22" rx="4" fill="#021405" stroke="#00ff41" stroke-opacity="0.5" stroke-width="1" />
        <text x="57" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00ff41">
          ESP32 // C++
        </text>

        <rect x="125" width="135" height="22" rx="4" fill="#021405" stroke="#00ff41" stroke-opacity="0.5" stroke-width="1" />
        <text x="192" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00ff41">
          PYTHON // PYTORCH
        </text>

        <rect x="270" width="125" height="22" rx="4" fill="#021405" stroke="#00ff41" stroke-opacity="0.5" stroke-width="1" />
        <text x="332" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00ff41">
          REACT // WEB UIs
        </text>

        <rect x="405" width="145" height="22" rx="4" fill="#00ff41" fill-opacity="0.1" stroke="#00ff41" stroke-width="1" />
        <text x="477" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#00ff41">
          STATUS: ONLINE
        </text>
      </g>
    </g>
  </g>
</svg>
